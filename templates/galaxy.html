{% extends "base.html" %}

{% block title %}Skill Galaxy - SkillGap{% endblock %}

{% block content %}
<div class="dashboard" style="height: calc(100vh - 120px); overflow: hidden; display: flex; flex-direction: column;">
  <div class="header" style="margin-bottom: 24px;">
    <p class="text-accent uppercase font-bold mb-1" style="font-size: 0.75rem; letter-spacing: 0.15em;">Immersive Visualization</p>
    <h1 style="font-family: 'Syne', sans-serif; font-size: 2.2rem; letter-spacing: -1px; margin: 0;">Skill Galaxy</h1>
    <p class="text-muted" style="font-size: 0.95rem;">Interactive 3D mapping of global technology clusters.</p>
  </div>

  <div id="galaxy-viewport" class="glass-card" style="flex: 1; position: relative; overflow: hidden; background: #050a12; border: 1px solid var(--border);">
    <canvas id="map-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%;"></canvas>
    <div class="hint-text" id="galaxy-hint">Click a cluster to explore</div>
    
    <div id="detail-layer" style="position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .6s ease;">
      <canvas id="detail-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab;"></canvas>
      <button id="back-btn-inline" class="glass-btn btn-sm" style="position: absolute; top: 20px; left: 20px; z-index: 100; border-radius: 20px;">
        <i data-lucide="arrow-left" style="width: 14px; margin-right: 6px;"></i> Back to Map
      </button>
    </div>

    <!-- Skill Tooltip -->
    <div id="skill-tooltip" class="glass-card" style="position: absolute; pointer-events: none; z-index: 200; padding: 12px 16px; opacity: 0; transform: translate(-50%, -120%); transition: opacity .2s, transform .2s; min-width: 150px; background: rgba(10,10,15,0.9); backdrop-filter: blur(12px);">
      <h4 id="tooltip-skill" style="margin: 0 0 4px 0; font-size: 1rem; color: #fff;">Skill</h4>
      <p id="tooltip-desc" class="text-muted" style="font-size: 0.75rem; margin: 0;">Cluster integration active</p>
    </div>
    
    <div class="galaxy-controls">
        <div id="cat-bar" class="flex flex-wrap justify-center gap-2 p-4" style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(5,10,18,0.8), transparent); z-index: 10; padding-bottom: 24px;"></div>
    </div>
  </div>
</div>

<style>
  .hint-text {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,.3);
    text-transform: uppercase; animation: pulse-hint 2.5s infinite; pointer-events: none;
  }
  @keyframes pulse-hint { 0%,100%{opacity:.3} 50%{opacity:.7} }
  
  .cat-btn {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; padding: 6px 16px;
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.5);
    cursor: pointer; transition: all .3s ease; white-space: nowrap;
  }
  .cat-btn:hover, .cat-btn.active {
    border-color: var(--clr); color: var(--clr);
    background: rgba(255,255,255,0.08); box-shadow: 0 0 15px -5px var(--clr);
  }
  
  #skill-tooltip.show { opacity: 1; transform: translate(-50%, -130%); }
</style>

<script>
// ═══════════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════════
const GALAXIES = [
  {
    id: 'devops', label: 'DevOps', color: '#e8773a',
    skills: ['Docker','Kubernetes','CI/CD','Terraform','Ansible','Jenkins','GitHub Actions','Prometheus','Grafana','Helm']
  },
  {
    id: 'cloud', label: 'Cloud', color: '#4ab8d4',
    skills: ['AWS','Azure','GCP','Serverless','CDN','IAM','S3','Lambda','CloudFormation','VPC']
  },
  {
    id: 'languages', label: 'Languages', color: '#9b72d4',
    skills: ['Python','JavaScript','TypeScript','Go','Rust','Java','C++','Kotlin','Swift','Ruby']
  },
  {
    id: 'ml', label: 'ML / AI', color: '#d4507a',
    skills: ['TensorFlow','PyTorch','Transformers','LLMs','RAG','Diffusion','RL','NLP','CV','MLOps']
  },
  {
    id: 'frontend', label: 'Frontend', color: '#3dd4a0',
    skills: ['React','Vue','Svelte','WebGL','CSS','Three.js','Next.js','Tailwind','Animation','PWA']
  },
  {
    id: 'backend', label: 'Backend', color: '#c9b030',
    skills: ['Node.js','FastAPI','Django','GraphQL','REST','gRPC','Microservices','Auth','Caching','Queues']
  },
  {
    id: 'databases', label: 'Databases', color: '#4a7fbf',
    skills: ['PostgreSQL','MongoDB','Redis','Elasticsearch','Cassandra','Neo4j','DynamoDB','SQLite','Clickhouse','Supabase']
  }
];

// ═══════════════════════════════════════════════════════════
//  STARS
// ═══════════════════════════════════════════════════════════
(function initStars() {
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];

  function resize() {
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
    stars = Array.from({length: 260}, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.3 + .2,
      a: Math.random(),
      speed: Math.random() * .003 + .001,
      phase: Math.random() * Math.PI * 2
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    stars.forEach(s => {
      const alpha = .3 + .5 * Math.abs(Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,210,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

// ═══════════════════════════════════════════════════════════
//  OVERVIEW MAP
// ═══════════════════════════════════════════════════════════
const mapCanvas  = document.getElementById('map-canvas');
const mapCtx     = mapCanvas.getContext('2d');
let mapGalaxies  = [];
let hoveredMap   = null;
let mapAnimFrame;

function hex2rgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function buildMapGalaxies() {
  const W = mapCanvas.width, H = mapCanvas.height;
  const cx = W/2, cy = H * .44;
  const rx = Math.min(W*.34, 280), ry = Math.min(H*.3, 220);
  const n  = GALAXIES.length;
  mapGalaxies = GALAXIES.map((g, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    return {
      ...g,
      cx: cx + Math.cos(angle) * rx,
      cy: cy + Math.sin(angle) * ry,
      radius: 58,
      orbs: Array.from({length: 3}, (_, j) => ({
        angle: (j / 3) * Math.PI * 2,
        dist: 28 + j * 9,
        speed: .4 + j * .15,
        r: 4 - j * .8
      }))
    };
  });
}

function drawMapGalaxy(g, t, hov) {
  const ctx = mapCtx;
  const [r,gr,b] = hex2rgb(g.color);
  const scale = hov ? 1.12 : 1;
  const R = g.radius * scale;

  ctx.save();
  ctx.translate(g.cx, g.cy);

  // outer glow
  const glow = ctx.createRadialGradient(0,0,R*.3, 0,0, R*1.8);
  glow.addColorStop(0, `rgba(${r},${gr},${b},${hov?.3:.15})`);
  glow.addColorStop(1, `rgba(${r},${gr},${b},0)`);
  ctx.beginPath();
  ctx.arc(0,0, R*1.8, 0, Math.PI*2);
  ctx.fillStyle = glow;
  ctx.fill();

  // planet sphere
  const sph = ctx.createRadialGradient(-R*.25,-R*.25, R*.05, 0,0, R);
  sph.addColorStop(0, `rgba(${Math.min(r+60,255)},${Math.min(gr+50,255)},${Math.min(b+50,255)},1)`);
  sph.addColorStop(.5, `rgba(${r},${gr},${b},1)`);
  sph.addColorStop(1, `rgba(${Math.max(r-60,0)},${Math.max(gr-60,0)},${Math.max(b-60,0)},1)`);
  ctx.beginPath();
  ctx.arc(0,0, R, 0, Math.PI*2);
  ctx.fillStyle = sph;
  ctx.fill();

  // inner highlight
  const hi = ctx.createRadialGradient(-R*.3,-R*.3, 0, -R*.1,-R*.1, R*.55);
  hi.addColorStop(0,'rgba(255,255,255,.55)');
  hi.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0,0, R, 0, Math.PI*2);
  ctx.fillStyle = hi;
  ctx.fill();

  // ring
  ctx.beginPath();
  ctx.ellipse(0, 0, R*1.45, R*.32, -.35, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(${r},${gr},${b},.45)`;
  ctx.lineWidth = hov ? 2 : 1.2;
  ctx.stroke();

  // orbiting dots
  g.orbs.forEach(o => {
    const a = o.angle + t * o.speed;
    const ox = Math.cos(a) * o.dist * scale;
    const oy = Math.sin(a) * o.dist * scale * .38;
    ctx.beginPath();
    ctx.arc(ox, oy, o.r * scale, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${r},${gr},${b},.85)`;
    ctx.fill();
  });

  // label
  ctx.font = `600 12px 'Exo 2', sans-serif`;
  ctx.fillStyle = `rgba(${r},${gr},${b},${hov?1:.8})`;
  ctx.textAlign = 'center';
  ctx.fillText(g.label, 0, R + 20);

  ctx.restore();
}

function animateMap() {
  mapCanvas.width  = window.innerWidth;
  mapCanvas.height = window.innerHeight;
  buildMapGalaxies();

  let last = 0;
  function frame(ts) {
    const t = ts / 1000;
    mapCtx.clearRect(0,0,mapCanvas.width,mapCanvas.height);
    mapGalaxies.forEach(g => drawMapGalaxy(g, t, g === hoveredMap));
    mapAnimFrame = requestAnimationFrame(frame);
  }
  mapAnimFrame = requestAnimationFrame(frame);
}

mapCanvas.addEventListener('mousemove', e => {
  const rect = mapCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  hoveredMap = mapGalaxies.find(g => {
    const dx = mx - g.cx, dy = my - g.cy;
    return Math.sqrt(dx*dx+dy*dy) < g.radius * 1.4;
  }) || null;
  mapCanvas.style.cursor = hoveredMap ? 'pointer' : 'default';
});

mapCanvas.addEventListener('click', e => {
  if (hoveredMap) openGalaxy(hoveredMap);
});

// ═══════════════════════════════════════════════════════════
//  DETAIL 3D VIEW
// ═══════════════════════════════════════════════════════════
const detailCanvas = document.getElementById('detail-canvas');
const dCtx         = detailCanvas.getContext('2d');
let currentGalaxy  = null;
let skillOrbs      = [];
let detailAnimFrame;

// drag / scroll state
let isDragging = false, lastMX = 0, lastMY = 0;
let rotY = 0, rotX = .3;
let zoom = 1;

function buildSkillOrbs(galaxy) {
  const n = galaxy.skills.length;
  skillOrbs = galaxy.skills.map((name, i) => {
    const rings   = [0, 1, 2];
    const ringIdx = Math.floor(i / 4);
    const posInRing = i % 4;
    const ringR   = 110 + ringIdx * 70;
    const ringTilt= [.3, .55, .15][ringIdx] || .3;
    const baseAngle = (posInRing / Math.min(4, n - ringIdx*4)) * Math.PI * 2;
    return {
      name, ringR, ringTilt,
      baseAngle,
      speed: .22 - ringIdx * .04,
      r: 14 - ringIdx * 2,
      hovered: false,
      _screen: {x:0, y:0, z:0}
    };
  });
}

function project3D(x, y, z, W, H) {
  // rotate Y
  const x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
  const z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
  // rotate X
  const y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
  const z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
  const fov = 500 * zoom;
  const scale = fov / (fov + z2 + 200);
  return { sx: W/2 + x1 * scale, sy: H/2 + y2 * scale, scale, z: z2 };
}

function drawDetailScene(t) {
  const W = detailCanvas.width, H = detailCanvas.height;
  dCtx.clearRect(0,0,W,H);

  const g = currentGalaxy;
  const [r,gr,b] = hex2rgb(g.color);

  // ambient glow behind sun
  const aura = dCtx.createRadialGradient(W/2,H/2,10, W/2,H/2, 200);
  aura.addColorStop(0, `rgba(${r},${gr},${b},.18)`);
  aura.addColorStop(1, `rgba(${r},${gr},${b},0)`);
  dCtx.beginPath();
  dCtx.arc(W/2,H/2,200,0,Math.PI*2);
  dCtx.fillStyle = aura;
  dCtx.fill();

  // collect projected orbs
  const projected = skillOrbs.map(o => {
    const angle = o.baseAngle + t * o.speed;
    const ox3 = Math.cos(angle) * o.ringR;
    const oy3 = Math.sin(angle) * o.ringR * Math.cos(o.ringTilt);
    const oz3 = Math.sin(angle) * o.ringR * Math.sin(o.ringTilt);
    const p = project3D(ox3, oy3, oz3, W, H);
    o._screen = p;
    return { orb: o, ...p };
  });

  // draw orbital rings
  for (let ri = 0; ri < 3; ri++) {
    const ringR  = 110 + ri * 70;
    const tilt   = [.3, .55, .15][ri];
    const pts    = 60;
    dCtx.beginPath();
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const rx3 = Math.cos(a) * ringR;
      const ry3 = Math.sin(a) * ringR * Math.cos(tilt);
      const rz3 = Math.sin(a) * ringR * Math.sin(tilt);
      const p = project3D(rx3, ry3, rz3, W, H);
      i === 0 ? dCtx.moveTo(p.sx, p.sy) : dCtx.lineTo(p.sx, p.sy);
    }
    dCtx.strokeStyle = `rgba(${r},${gr},${b},.15)`;
    dCtx.lineWidth = 1;
    dCtx.stroke();
  }

  // sort by z for painter's algo
  projected.sort((a, b) => a.z - b.z);

  projected.forEach(({ orb, sx, sy, scale }) => {
    const orbR = orb.r * scale;
    const alpha = (.4 + .6 * Math.max(0, (orb._screen.z + 200) / 400));
    const [r2,g2,b2] = hex2rgb(g.color);

    // glow
    if (orb.hovered || alpha > .7) {
      const og = dCtx.createRadialGradient(sx,sy,0, sx,sy, orbR*3);
      og.addColorStop(0, `rgba(${r2},${g2},${b2},${.25*alpha})`);
      og.addColorStop(1, `rgba(${r2},${g2},${b2},0)`);
      dCtx.beginPath();
      dCtx.arc(sx,sy, orbR*3, 0, Math.PI*2);
      dCtx.fillStyle = og;
      dCtx.fill();
    }

    // sphere
    const sg = dCtx.createRadialGradient(sx-orbR*.3,sy-orbR*.3, orbR*.05, sx,sy, orbR);
    sg.addColorStop(0, `rgba(${Math.min(r2+80,255)},${Math.min(g2+70,255)},${Math.min(b2+70,255)},${alpha})`);
    sg.addColorStop(.6, `rgba(${r2},${g2},${b2},${alpha})`);
    sg.addColorStop(1,  `rgba(${Math.max(r2-50,0)},${Math.max(g2-50,0)},${Math.max(b2-50,0)},${alpha})`);
    dCtx.beginPath();
    dCtx.arc(sx, sy, orbR, 0, Math.PI*2);
    dCtx.fillStyle = sg;
    dCtx.fill();

    // highlight
    const hg = dCtx.createRadialGradient(sx-orbR*.3,sy-orbR*.3,0, sx-orbR*.1,sy-orbR*.1, orbR*.6);
    hg.addColorStop(0, `rgba(255,255,255,${.5*alpha})`);
    hg.addColorStop(1, `rgba(255,255,255,0)`);
    dCtx.beginPath();
    dCtx.arc(sx, sy, orbR, 0, Math.PI*2);
    dCtx.fillStyle = hg;
    dCtx.fill();

    // label on hover
    if (orb.hovered) {
      dCtx.font = `500 ${Math.round(11*scale+8)}px 'Exo 2', sans-serif`;
      dCtx.fillStyle = `rgba(${r2},${g2},${b2},1)`;
      dCtx.textAlign = 'center';
      dCtx.fillText(orb.name, sx, sy - orbR - 8);
    }
  });

  // central sun
  const sunR = 42;
  const pulse = 1 + .06 * Math.sin(t * 1.8);
  const sunG = dCtx.createRadialGradient(W/2-12,H/2-12, 2, W/2,H/2, sunR*pulse*1.6);
  sunG.addColorStop(0, '#ffffff');
  sunG.addColorStop(.2, `rgba(${r},${gr},${b},1)`);
  sunG.addColorStop(.7, `rgba(${r},${gr},${b},.8)`);
  sunG.addColorStop(1,  `rgba(${r},${gr},${b},0)`);
  dCtx.beginPath();
  dCtx.arc(W/2, H/2, sunR * pulse * 1.6, 0, Math.PI*2);
  dCtx.fillStyle = sunG;
  dCtx.fill();

  dCtx.beginPath();
  dCtx.arc(W/2, H/2, sunR * pulse, 0, Math.PI*2);
  const core = dCtx.createRadialGradient(W/2-10,H/2-10,2, W/2,H/2, sunR*pulse);
  core.addColorStop(0,'#ffffff');
  core.addColorStop(.35, `rgba(${Math.min(r+80,255)},${Math.min(gr+80,255)},${Math.min(b+80,255)},1)`);
  core.addColorStop(1, `rgba(${r},${gr},${b},1)`);
  dCtx.fillStyle = core;
  dCtx.fill();

  // sun label
  dCtx.font = `700 13px 'Orbitron', sans-serif`;
  dCtx.fillStyle = '#fff';
  dCtx.textAlign = 'center';
  dCtx.textBaseline = 'middle';
  dCtx.fillText(g.label.toUpperCase(), W/2, H/2);
  dCtx.textBaseline = 'alphabetic';
}

let detailT0 = 0;
function animateDetail(ts) {
  const t = (ts - detailT0) / 1000;
  detailCanvas.width  = window.innerWidth;
  detailCanvas.height = window.innerHeight;
  drawDetailScene(t);
  detailAnimFrame = requestAnimationFrame(animateDetail);
}

// Drag + scroll
detailCanvas.addEventListener('mousedown', e => { isDragging = true; lastMX = e.clientX; lastMY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  rotY += dx * .007;
  rotX += dy * .007;
  rotX = Math.max(-.9, Math.min(.9, rotX));
  lastMX = e.clientX; lastMY = e.clientY;
});
detailCanvas.addEventListener('wheel', e => {
  zoom *= e.deltaY > 0 ? .93 : 1.07;
  zoom = Math.max(.4, Math.min(2.2, zoom));
});

// Tooltip on orb hover
detailCanvas.addEventListener('mousemove', e => {
  if (isDragging || !currentGalaxy) return;
  const rect = detailCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const tip = document.getElementById('tooltip');
  let found = null;
  skillOrbs.forEach(o => {
    o.hovered = false;
    const dx = mx - o._screen.sx, dy = my - o._screen.sy;
    if (Math.sqrt(dx*dx+dy*dy) < o.r * o._screen.scale + 5) found = o;
  });
  if (found) {
    found.hovered = true;
    tip.textContent = found.name;
    tip.style.left  = e.clientX + 'px';
    tip.style.top   = e.clientY + 'px';
    tip.classList.add('show');
  } else {
    tip.classList.remove('show');
  }
});

// ═══════════════════════════════════════════════════════════
//  TRANSITIONS
// ═══════════════════════════════════════════════════════════
function openGalaxy(g) {
  currentGalaxy = g;
  rotY = 0; rotX = .3; zoom = 1;
  buildSkillOrbs(g);

  document.getElementById('overview').classList.add('hidden');
  cancelAnimationFrame(mapAnimFrame);

  setTimeout(() => {
    detailT0 = performance.now();
    detailCanvas.width = window.innerWidth;
    detailCanvas.height = window.innerHeight;
    document.getElementById('detail').classList.add('visible');
    document.getElementById('back-btn').classList.add('visible');
    updateCatBar(g.id);
    detailAnimFrame = requestAnimationFrame(animateDetail);
  }, 300);
}

function closeDetail() {
  document.getElementById('detail').classList.remove('visible');
  document.getElementById('back-btn').classList.remove('visible');
  cancelAnimationFrame(detailAnimFrame);
  document.getElementById('tooltip').classList.remove('show');
  updateCatBar(null);

  setTimeout(() => {
    document.getElementById('overview').classList.remove('hidden');
    animateMap();
  }, 300);
}

function switchGalaxy(g) {
  if (g === currentGalaxy) return;
  currentGalaxy = g;
  rotY = 0; rotX = .3; zoom = 1;
  buildSkillOrbs(g);
  updateCatBar(g.id);
}

// ═══════════════════════════════════════════════════════════
//  CATEGORY BAR
// ═══════════════════════════════════════════════════════════
function buildCatBar() {
  const bar = document.getElementById('cat-bar');
  bar.innerHTML = '';
  GALAXIES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.id = g.id;
    btn.textContent = g.label.toUpperCase();
    btn.style.setProperty('--clr', g.color);
    btn.addEventListener('click', () => {
      if (document.getElementById('detail').classList.contains('visible')) {
        switchGalaxy(g);
      } else {
        openGalaxy(g);
      }
    });
    bar.appendChild(btn);
  });
}

function updateCatBar(activeId) {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === activeId);
  });
}

// ═══════════════════════════════════════════════════════════
//  BACK BUTTON
// ═══════════════════════════════════════════════════════════
document.getElementById('back-btn').addEventListener('click', closeDetail);

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
buildCatBar();
animateMap();

window.addEventListener('resize', () => {
  mapCanvas.width  = window.innerWidth;
  mapCanvas.height = window.innerHeight;
  buildMapGalaxies();
});
</script>
</body>
