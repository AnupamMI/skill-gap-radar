<!DOCTYPE html>
<html>
<head>
    <title>Start a Conversation - Skill Gap Radar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0A1F44 0%, #1A1A1A 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #FFFFFF;
        }
        
        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .back-nav {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .back-nav a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }
        
        .back-nav a:hover {
            color: #B8C6DB;
            text-decoration: underline;
        }
        
        .header {
            background: linear-gradient(135deg, #0A1F44 0%, #36454F 100%);
            color: white;
            padding: 30px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFFFFF 0%, #B8C6DB 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        
        .header p {
            font-size: 14px;
            color: #B8C6DB;
            letter-spacing: 0.3px;
        }
        
        .search-box {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(10, 31, 68, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .users-list {
            flex: 1;
            overflow-y: auto;
            background: transparent;
        }
        
        .user-item {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .user-item:hover {
            background: rgba(255, 255, 255, 0.08);
            padding-left: 25px;
        }
        
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0A1F44 0%, #36454F 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(10, 31, 68, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .user-content {
            flex: 1;
            min-width: 0;
        }
        
        .user-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .user-content h3 {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .user-content p {
            font-size: 13px;
            color: #B8C6DB;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        
        .online-indicator {
            width: 10px;
            height: 10px;
            background: #2ED573;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3);
        }
        
        .offline-indicator {
            width: 10px;
            height: 10px;
            background: #B8C6DB;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #B8C6DB;
            padding: 40px;
            text-align: center;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.7;
        }
        
        .empty-state p {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        
        .empty-state small {
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 0.2px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }
            
            .user-item:hover {
                padding-left: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="back-nav">
        <a href="/messenger">← Back to Conversations</a>
    </div>
    
    <div class="header">
        <h1>Start a Conversation</h1>
        <p>Select a contact to begin messaging</p>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by name or role...">
    </div>
    
    <div class="users-list" id="usersList">
        {% if users %}
            {% for user in users %}
            <div class="user-item" onclick="startChat({{ user[0] }}, '{{ user[1] }}')">
                <div class="user-avatar">{{ user[1][0].upper() }}</div>
                <div class="user-content">
                    <div class="user-header">
                        <h3>{{ user[1] }}</h3>
                        <span class="online-indicator" title="Online"></span>
                    </div>
                    <p>{{ user[2] }}</p>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <div class="empty-state-icon">👥</div>
                <p>No contacts available</p>
                <small>Check back later or create new connections</small>
            </div>
        {% endif %}
    </div>
    
</div>

<script>
function startChat(userId, userName) {
    window.location.href = `/start_chat/${userId}`;
}

// Search functionality
document.getElementById('searchInput').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const items = document.querySelectorAll('.user-item');
    
    items.forEach(item => {
        const name = item.querySelector('h3').textContent.toLowerCase();
        const role = item.querySelector('p').textContent.toLowerCase();
        
        if (name.includes(searchTerm) || role.includes(searchTerm)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
});
</script>

</body>
</html>
