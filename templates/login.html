<!DOCTYPE html>
<html>
<head>
    <title>Login - Skill Gap Radar</title>
    <style>
        body { font-family: Arial; background:#eef2f7; text-align:center; }
        .box {
            background:white;
            width:320px;
            margin:120px auto;
            padding:25px;
            border-radius:12px;
            box-shadow:0 6px 14px rgba(0,0,0,0.12);
        }
        input,select {
            width:90%;
            padding:10px;
            margin:8px 0;
        }
        button {
            padding:10px 18px;
            background:#2ecc71;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }
        a { display:block; margin-top:12px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Login</h2>

    <form method="POST">
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>

    <a href="/register">Create Account</a>
</div>

</body>
</html>
