{% extends "base.html" %}

{% block title %}Login - Skill Gap Radar{% endblock %}

{% block layout %}
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <h2 class="font-display text-center mb-2">Welcome Back</h2>
        <p class="text-muted text-center mb-8" style="font-size: 0.9rem;">Sign in to your Skill Gap Radar account.</p>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="form-group mb-8">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-full" style="padding: 0.875rem;">Sign In</button>
        </form>
        
        <p class="text-center mt-6" style="font-size: 0.9rem;">
            <span class="text-muted">Don't have an account?</span> 
            <a href="/register" class="text-primary" style="text-decoration: none; font-weight: 500;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
