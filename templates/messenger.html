<!DOCTYPE html>
<html>
<head>
    <title>Messenger - Skill Gap Radar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0A1F44 0%, #1A1A1A 100%);
        }
        
        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #0A1F44 0%, #36454F 100%);
            color: white;
            padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #B8C6DB 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        
        .header a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 9px 14px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header a:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
        }
        
        .conversation-item {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        
        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.08);
            padding-left: 25px;
        }
        
        .conversation-info {
            flex: 1;
        }
        
        .conversation-info h3 {
            font-size: 16px;
            color: #FFFFFF;
            margin-bottom: 5px;
            font-weight: 700;
        }
        
        .conversation-info p {
            font-size: 13px;
            color: #B8C6DB;
            letter-spacing: 0.2px;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0A1F44 0%, #36454F 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 12px rgba(10, 31, 68, 0.3);
        }
        
        .online-badge {
            width: 12px;
            height: 12px;
            background: #2ED573;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3);
        }
        
        .tabs {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 20px;
            padding: 0 20px;
            backdrop-filter: blur(10px);
        }
        
        .tab {
            padding: 16px 0;
            cursor: pointer;
            font-weight: 600;
            color: #B8C6DB;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }
        
        .tab.active {
            color: #FFFFFF;
            border-bottom-color: #0A1F44;
        }
        
        .tab:hover {
            color: #FFFFFF;
        }
        
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #B8C6DB;
        }
        
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #2ED573 0%, #27a952 100%);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(46, 213, 115, 0.35);
            transition: all 0.3s;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .fab:hover {
            background: linear-gradient(135deg, #27a952 0%, #1fa03f 100%);
            transform: scale(1.1);
            box-shadow: 0 12px 36px rgba(46, 213, 115, 0.45);
        }
        
        .search-box {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .search-box input {
            width: 100%;
            padding: 11px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(10, 31, 68, 0.2);
        }
    </style>
</head>

<body>

<div class="container">
    
    <div class="header">
        <h1>💬 Messenger</h1>
        <a href="/">← Back</a>
    </div>
    
    <div class="tabs">
        <div class="tab active">💬 Chats</div>
        <div class="tab">👥 Groups</div>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search conversations...">
    </div>
    
    <div class="conversations-list" id="chatsList">
        {% if chats %}
            {% for chat in chats %}
            <a href="/chatroom/{{ chat[0] }}" class="conversation-item">
                <div class="avatar">{{ chat[1][0].upper() }}</div>
                <div class="conversation-info">
                    <h3>{{ chat[1] }}</h3>
                    <p>Tap to open chat</p>
                </div>
                <div class="online-badge"></div>
            </a>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <p>No conversations yet</p>
                <p style="font-size: 12px; margin-top: 10px;">Click the + button to start a new chat</p>
            </div>
        {% endif %}
    </div>
    
</div>

<!-- NEW CHAT BUTTON -->
<a href="/messages" class="fab">✏️</a>

<script>
document.getElementById('searchInput').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const items = document.querySelectorAll('.conversation-item');
    
    items.forEach(item => {
        const name = item.querySelector('h3').textContent.toLowerCase();
        if (name.includes(searchTerm)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
});
</script>

</body>
</html>
