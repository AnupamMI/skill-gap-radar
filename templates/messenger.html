<!DOCTYPE html>
<html>
<head>
    <title>Messenger - Skill Gap Radar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
        }
        
        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #075e54;
            color: white;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
        }
        
        .header a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .header a:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }
        
        .conversation-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        
        .conversation-item:hover {
            background: #f5f5f5;
        }
        
        .conversation-info {
            flex: 1;
        }
        
        .conversation-info h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .conversation-info p {
            font-size: 13px;
            color: #999;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }
        
        .online-badge {
            width: 12px;
            height: 12px;
            background: #31a24c;
            border-radius: 50%;
            display: inline-block;
        }
        
        .tabs {
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 20px;
            padding: 0 20px;
        }
        
        .tab {
            padding: 15px 0;
            cursor: pointer;
            font-weight: 500;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #075e54;
            border-bottom-color: #075e54;
        }
        
        .tab:hover {
            color: #075e54;
        }
        
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .fab:hover {
            background: #1ebe5d;
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
        }
        
        .search-box {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #ddd;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #075e54;
        }
    </style>
</head>

<body>

<div class="container">
    
    <div class="header">
        <h1>💬 Messenger</h1>
        <a href="/">← Back</a>
    </div>
    
    <div class="tabs">
        <div class="tab active">💬 Chats</div>
        <div class="tab">👥 Groups</div>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search conversations...">
    </div>
    
    <div class="conversations-list" id="chatsList">
        {% if chats %}
            {% for chat in chats %}
            <a href="/chatroom/{{ chat[0] }}" class="conversation-item">
                <div class="avatar">{{ chat[1][0].upper() }}</div>
                <div class="conversation-info">
                    <h3>{{ chat[1] }}</h3>
                    <p>Tap to open chat</p>
                </div>
                <div class="online-badge"></div>
            </a>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <p>No conversations yet</p>
                <p style="font-size: 12px; margin-top: 10px;">Click the + button to start a new chat</p>
            </div>
        {% endif %}
    </div>
    
</div>

<!-- NEW CHAT BUTTON -->
<a href="/messages" class="fab">✏️</a>

<script>
document.getElementById('searchInput').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const items = document.querySelectorAll('.conversation-item');
    
    items.forEach(item => {
        const name = item.querySelector('h3').textContent.toLowerCase();
        if (name.includes(searchTerm)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
});
</script>

</body>
</html>
