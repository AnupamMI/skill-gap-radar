<!DOCTYPE html>
<html>
<head>
    <title>Create Mentor Slots - Skill Gap Radar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0A1F44 0%, #1A1A1A 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #FFFFFF;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #B8C6DB 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        
        .back-link {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.3px;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            color: #B8C6DB;
            text-decoration: underline;
        }
        
        .form-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .form-card h2 {
            color: #FFFFFF;
            margin-bottom: 25px;
            font-size: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: 0.3px;
        }
        
        .form-group input,
        .form-group select {
            padding: 13px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            font-family: inherit;
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(10, 31, 68, 0.2);
        }
        
        .help-text {
            font-size: 12px;
            color: #B8C6DB;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }
        
        .info-box {
            background: rgba(10, 31, 68, 0.3);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 3px solid #0A1F44;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-box p {
            color: #B8C6DB;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #0A1F44 0%, #36454F 100%);
            color: white;
            padding: 13px 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }
        
        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #1A3A5C 0%, #4A5F6F 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(10, 31, 68, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            border-left: 3px solid;
        }
        
        .alert-success {
            background: rgba(46, 213, 115, 0.1);
            color: #2ED573;
            border-color: #2ED573;
        }
        
        .alert-error {
            background: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
            border-color: #FF6B6B;
        }
        
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📅 Create Mentor Slot</h1>
        <a href="/teacher_mentor_requests" class="back-link">← View Requests</a>
    </div>
    
    <div class="form-card">
        <h2>Add Your Availability</h2>
        
        <div class="info-box">
            <p>Create a mentoring time slot for students to book. You can create multiple slots for different days and times.</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <form onsubmit="submitSlot(event)">
            <div class="form-group">
                <label for="day">📅 Day of Week</label>
                <select id="day" name="day" required>
                    <option value="">Select a day...</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label for="start_time">⏰ Start Time</label>
                    <input type="time" id="start_time" name="start_time" required>
                    <span class="help-text">e.g., 09:00</span>
                </div>
                <div class="form-group">
                    <label for="end_time">⏰ End Time</label>
                    <input type="time" id="end_time" name="end_time" required>
                    <span class="help-text">e.g., 10:00</span>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label for="capacity">👥 Capacity</label>
                    <input type="number" id="capacity" name="capacity" min="1" max="10" value="2" required>
                    <span class="help-text">Groups can register (1-10)</span>
                </div>
                <div class="form-group">
                    <label for="mode">📍 Mode</label>
                    <select id="mode" name="mode" required>
                        <option value="online">💻 Online</option>
                        <option value="offline">🏢 Offline</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">✓ Create Slot</button>
        </form>
    </div>
</div>

<script>
function submitSlot(event) {
    event.preventDefault();
    
    let day = document.getElementById('day').value;
    let start_time = document.getElementById('start_time').value;
    let end_time = document.getElementById('end_time').value;
    let capacity = document.getElementById('capacity').value;
    let mode = document.getElementById('mode').value;
    
    if (start_time >= end_time) {
        showAlert('End time must be after start time', 'error');
        return;
    }
    
    let formData = new FormData();
    formData.append('day', day);
    formData.append('start_time', start_time);
    formData.append('end_time', end_time);
    formData.append('capacity', capacity);
    formData.append('mode', mode);
    
    let btn = event.target.querySelector('.submit-btn');
    btn.disabled = true;
    btn.textContent = 'Creating...';
    
    fetch('/create_mentor_slot', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            showAlert('✓ Slot created successfully!', 'success');
            document.querySelector('form').reset();
            setTimeout(() => {
                window.location.href = '/teacher_mentor_requests';
            }, 1500);
        } else {
            showAlert('Error: ' + (data.error || 'Failed to create slot'), 'error');
        }
        btn.disabled = false;
        btn.textContent = '✓ Create Slot';
    })
    .catch(err => {
        showAlert('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '✓ Create Slot';
    });
}

function showAlert(message, type) {
    let container = document.getElementById('alertContainer');
    let alert = document.createElement('div');
    alert.className = 'alert alert-' + type;
    alert.textContent = message;
    container.innerHTML = '';
    container.appendChild(alert);
    
    if (type === 'error') {
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }
}
</script>

</body>
</html>
