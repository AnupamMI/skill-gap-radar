{% extends "base.html" %}

{% block title %}Register - Skill Gap Radar{% endblock %}

{% block layout %}
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 450px; padding: 2.5rem;">
        <h2 class="font-display text-center mb-2">Create an Account</h2>
        <p class="text-muted text-center mb-8" style="font-size: 0.9rem;">Kickstart your personalized career roadmap.</p>
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <div class="form-group mb-8">
                <label class="form-label">I am a...</label>
                <select name="role" class="form-control" required>
                    <option value="student">Student / Learner</option>
                    <option value="teacher">Mentor / Teacher</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary w-full" style="padding: 0.875rem;">Create Account</button>
        </form>
        
        <p class="text-center mt-6" style="font-size: 0.9rem;">
            <span class="text-muted">Already have an account?</span> 
            <a href="/login" class="text-primary" style="text-decoration: none; font-weight: 500;">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
